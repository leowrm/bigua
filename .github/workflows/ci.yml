name: Testes Biguá

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "ci-only-secret-key"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8000"
      DB_ENGINE: "sqlite3"
      SQLITE_NAME: "ci.sqlite3"
      WHATSAPP_VERIFY_TOKEN: "ci-token"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Verificar sintaxe
        run: python -m compileall -q .
      - name: Verificar configuração de produção
        run: python manage.py check --deploy
      - name: Verificar migrações
        run: python manage.py migrate --check --noinput
      - name: Coletar arquivos estáticos
        run: python manage.py collectstatic --noinput
      - name: Rodar testes
        run: python manage.py test --verbosity 2
