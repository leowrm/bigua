{% extends "app.html" %}

{% block content %}
<div class="screen active">
    <div class="card" style="max-width:480px;margin:60px auto;">
        <div class="card-header">
            <div class="card-title">Confirmar baixa de bem</div>
        </div>
        <p style="margin:16px 0;">
            Tem certeza que deseja baixar o bem <strong>{{ patrimonio.nome_patrimonio }}</strong>?
        </p>
        <p style="margin:16px 0;">
            Esta ação não poderá ser desfeita.
        </p>
        <div style="display:flex;gap:8px;">
            <form method="POST" action="{% url 'baixar-bem' id_patrimonio=patrimonio.id_patrimonio %}"> {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sim, baixar</button>
            </form>
            <a href="{% url 'patrimonio' %}" class="btn btn-ghost">Cancelar</a>
        </div>
    </div>
</div>
{% endblock content %}
